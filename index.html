<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron &amp; Icebox</title>
<meta name="description" content="4-day upper/lower training log with rest timer, and a two-cook meal plan. Works offline.">
<meta name="theme-color" content="#0f7a72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single column app shell, sticky header + tabs, sticky rest timer at the foot */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eaefed; --line:#d3dbd8;
  --fg:#16211e; --fg-dim:#5d6b66; --fg-faint:#879590;
  --accent:#0f7a72; --accent-soft:#d6ebe8; --warm:#b4651f; --warm-soft:#f6e6d4;
  --on-accent:#ffffff;
  --font-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:10px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#182220; --surface-2:#1f2b28; --line:#2c3a36;
  --fg:#e8efec; --fg-dim:#9bada7; --fg-faint:#708079;
  --accent:#4cc3b5; --accent-soft:#17312e; --warm:#e0a062; --warm-soft:#33261a;
  --on-accent:#06201d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#182220; --surface-2:#1f2b28; --line:#2c3a36;
  --fg:#e8efec; --fg-dim:#9bada7; --fg-faint:#708079;
  --accent:#4cc3b5; --accent-soft:#17312e; --warm:#e0a062; --warm-soft:#33261a;
  --on-accent:#06201d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:1.1rem;letter-spacing:-.01em}
.brand .meta{font-size:.72rem;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.08em}
nav.tabs{display:flex;gap:2px;margin-top:10px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;font-family:var(--font-display);font-size:.8rem;font-weight:600;color:var(--fg-dim);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main .wrap{padding-block:18px 96px}
section{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h2{font-size:1rem}
.daybtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.daybtn:hover{border-color:var(--accent)}
.daybtn .idx{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--accent);min-width:2ch;font-variant-numeric:tabular-nums}
.daybtn .body{flex:1;min-width:0}
.daybtn .body strong{font-family:var(--font-display);font-size:1rem;display:block}
.daybtn .body span{font-size:.82rem;color:var(--fg-dim)}
.chip{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--fg-dim);white-space:nowrap}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.lede{font-size:.88rem;color:var(--fg-dim)}
.sessionhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.78rem;cursor:pointer;color:var(--fg-dim)}
.ex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex h3{font-size:.95rem;display:flex;gap:8px;align-items:baseline}
.ex h3 .tag{font-family:var(--font-body);font-size:.7rem;font-weight:700;color:var(--accent);letter-spacing:.06em}
.ex .target{font-size:.78rem;color:var(--fg-dim);margin-top:2px}
.ex .note{font-size:.78rem;color:var(--fg-faint);margin-top:4px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.setrow,.colhead{display:grid;grid-template-columns:2.2rem 1fr 1fr 4.4rem;gap:6px;align-items:center}
.setrow .n{font-size:.74rem;color:var(--fg-faint);font-variant-numeric:tabular-nums}
.setrow input{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem;font-variant-numeric:tabular-nums}
.setrow input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setrow .last{font-size:.72rem;color:var(--fg-faint);text-align:right;font-variant-numeric:tabular-nums}
.colhead{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint);margin-top:10px}
.restbtn{margin-top:8px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:7px 14px;font-family:var(--font-display);font-weight:600;font-size:.78rem;cursor:pointer}
.save{margin-top:8px}
.btn{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius);padding:13px;font-family:var(--font-display);font-weight:600;font-size:.95rem;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.status{font-size:.78rem;color:var(--fg-dim);text-align:center;margin-top:6px;min-height:1.2em}
.histrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.histrow:last-child{border-bottom:0}
.histrow .d{color:var(--fg-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.histrow .sub{color:var(--fg-dim);font-size:.8rem}
.empty{text-align:center;color:var(--fg-dim);font-size:.86rem;padding:26px 10px}
.empty strong{display:block;font-family:var(--font-display);color:var(--fg);font-size:1rem;margin-bottom:4px}
details.dish,details.fold{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
details.dish:first-of-type,details.fold:first-of-type{border-top:0;margin-top:0;padding-top:0}
details summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details summary::-webkit-details-marker{display:none}
details .macros-line{font-size:.76rem;color:var(--accent);margin-top:6px;font-variant-numeric:tabular-nums}
details .selfline{font-size:.78rem;color:var(--fg-dim);margin-top:4px}
details h4{font-family:var(--font-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint);margin:12px 0 4px}
details ul,details ol{margin:0;padding-left:1.1rem;font-size:.85rem;color:var(--fg-dim)}
details li{margin-bottom:4px}
.reheat{font-size:.78rem;color:var(--fg-dim);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:10px}
.tl{display:flex;flex-direction:column;gap:0}
.tlrow{display:grid;grid-template-columns:3.2rem 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.tlrow:last-child{border-bottom:0}
.tlrow .t{font-family:var(--font-display);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.shopgroup{font-family:var(--font-display);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);margin:12px 0 4px}
.shopgroup:first-child{margin-top:0}
.shopitem{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:.88rem;cursor:pointer}
.shopitem input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.shopitem .q{margin-left:auto;color:var(--fg-faint);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.shopitem.on .nm{text-decoration:line-through;color:var(--fg-faint)}
.macros{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.macro{flex:1 1 86px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.macro b{display:block;font-family:var(--font-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.macro span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint)}
.note-bar{font-size:.78rem;color:var(--fg-dim);background:var(--surface-2);border-radius:8px;padding:9px 11px}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa:first-of-type{border-top:0}
.qa strong{font-family:var(--font-display);font-size:.88rem;display:block}
.qa span{font-size:.83rem;color:var(--fg-dim)}
.offline-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warm);margin-right:5px;vertical-align:middle}
/* rest timer */
#timerbar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(0,0,0,.09)}
#timerbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
#timerbar .tnum{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.3ch;letter-spacing:-.02em}
#timerbar .tlabel{flex:1;min-width:0;font-size:.76rem;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbar button{background:var(--surface-2);border:0;border-radius:999px;padding:8px 12px;font-family:var(--font-display);font-weight:600;font-size:.78rem;cursor:pointer;flex:none}
#timerbar button.stop{background:var(--accent);color:var(--on-accent)}
#tprog{height:3px;background:var(--accent);width:100%;transition:width .4s linear}
#timerbar.done .tnum{color:var(--warm)}
#timerbar.done #tprog{background:var(--warm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Iron &amp; Icebox</h1><span class="meta" id="hdr-meta">4-day upper/lower</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-train" aria-selected="true">Train</button>
    <button role="tab" id="tab-history" aria-selected="false">History</button>
    <button role="tab" id="tab-meals" aria-selected="false">Meals</button>
    <button role="tab" id="tab-shop" aria-selected="false">Shop</button>
  </nav>
</div></header>

<main><div class="wrap">
  <section id="view-train"></section>
  <section id="view-session" hidden></section>
  <section id="view-history" hidden></section>
  <section id="view-meals" hidden></section>
  <section id="view-shop" hidden></section>
</div></main>

<div id="timerbar" hidden>
  <div id="tprog"></div>
  <div class="wrap">
    <span class="tnum" id="tnum">0:00</span>
    <span class="tlabel" id="tlabel"></span>
    <button id="tplus">+30s</button>
    <button id="tstop" class="stop">Stop</button>
  </div>
</div>

<script src="./app-data.js"></script>
<script>
/* ---------- storage: this device only ---------- */
const KEY_S="ii.sessions.v1",KEY_SHOP="ii.shopping.v1",KEY_DRAFT="ii.draft.v1";
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
let sessions=load(KEY_S,[]),shopChecked=load(KEY_SHOP,{}),drafts=load(KEY_DRAFT,{});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const views={train:$("#view-train"),session:$("#view-session"),history:$("#view-history"),meals:$("#view-meals"),shop:$("#view-shop")};
const tabs={train:$("#tab-train"),history:$("#tab-history"),meals:$("#tab-meals"),shop:$("#tab-shop")};
let current=null;
function show(v){for(const k in views)views[k].hidden=true;views[v].hidden=false;
  for(const k in tabs)tabs[k].setAttribute("aria-selected",String(k===v||(v==="session"&&k==="train")));}
Object.keys(tabs).forEach(k=>tabs[k].addEventListener("click",()=>{
  if(current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}
  show(k);if(k==="train")renderTrain();if(k==="history")renderHistory();if(k==="shop")renderShop();
}));
window.addEventListener("pagehide",()=>{if(current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}
});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
function fmtDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function daysAgo(iso){const d=Math.round((Date.now()-new Date(iso+"T12:00:00").getTime())/86400000);
  return d<=0?"today":d===1?"yesterday":d+" days ago";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function lastFor(key){return sessions.filter(s=>s.dayKey===key).sort((a,b)=>b.date<a.date?-1:1)[0];}
function mmss(sec){const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;return (sec<0?"-":"")+m+":"+String(s).padStart(2,"0");}

/* ---------- unsaved drafts ---------- */
function draftKey(dayKey){return today()+"__"+dayKey;}
function collectSets(d){
  const sets={};let count=0;
  d.ex.forEach(e=>{
    const arr=[];let any=false;
    for(let i=0;i<e.s;i++){
      const w=(($("#"+e.id+"-w-"+i))||{}).value||"",r=(($("#"+e.id+"-r-"+i))||{}).value||"";
      arr.push({w:w.trim(),r:r.trim()});
      if(w.trim()||r.trim()){any=true;count++;}
    }
    if(any)sets[e.id]=arr;
  });
  return {sets:sets,count:count};
}
let dTimer=null,committed=false;
function queueDraft(){committed=false;clearTimeout(dTimer);dTimer=setTimeout(writeDraft,400);}
function writeDraft(){
  if(!current||committed)return;
  const k=draftKey(current.key),got=collectSets(current);
  if(got.count)drafts[k]={sets:got.sets,at:new Date().toISOString()};else delete drafts[k];
  save(KEY_DRAFT,drafts);
  const n=$("#draftnote");
  if(n)n.textContent=got.count?"Kept as you type — "+got.count+" set"+(got.count===1?"":"s")+" entered, not yet in your history.":"";
}
function dropDraft(dayKey){delete drafts[draftKey(dayKey)];save(KEY_DRAFT,drafts);}
function pruneDrafts(){
  const cut=Date.now()-3*86400000;let changed=false;
  Object.keys(drafts).forEach(k=>{
    const at=drafts[k]&&drafts[k].at?new Date(drafts[k].at).getTime():0;
    if(at<cut){delete drafts[k];changed=true;}
  });
  if(changed)save(KEY_DRAFT,drafts);
}

/* ---------- rest timer ---------- */
const bar=$("#timerbar");
let tEnd=0,tTotal=0,tTick=null,audio=null,beeped=false;
function unlockAudio(){
  if(audio)return;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}
  if(audio&&audio.state==="suspended")audio.resume().catch(()=>{});
}
function beep(){
  if(!audio)return;
  const t0=audio.currentTime;
  [0,0.28,0.56].forEach(off=>{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type="sine";o.frequency.value=880;
    g.gain.setValueAtTime(0,t0+off);
    g.gain.linearRampToValueAtTime(0.3,t0+off+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.22);
    o.connect(g);g.connect(audio.destination);
    o.start(t0+off);o.stop(t0+off+0.24);
  });
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate([200,120,200]);}catch(e){}}
function startRest(sec,label){
  unlockAudio();
  tTotal=sec;tEnd=Date.now()+sec*1000;beeped=false;
  bar.classList.remove("done");bar.hidden=false;
  $("#tlabel").textContent=label||"Rest";
  if(tTick)clearInterval(tTick);
  tTick=setInterval(paintTimer,200);paintTimer();
}
function paintTimer(){
  const left=Math.round((tEnd-Date.now())/1000);
  $("#tnum").textContent=mmss(left);
  const frac=Math.max(0,Math.min(1,left/Math.max(1,tTotal)));
  $("#tprog").style.width=(frac*100)+"%";
  if(left<=0&&!beeped){beeped=true;bar.classList.add("done");beep();buzz();$("#tlabel").textContent="Rest over — next set";}
  if(left<=-120)stopRest();
}
function stopRest(){if(tTick)clearInterval(tTick);tTick=null;bar.hidden=true;bar.classList.remove("done");}
$("#tstop").addEventListener("click",stopRest);
$("#tplus").addEventListener("click",()=>{if(bar.hidden)return;unlockAudio();tEnd+=30000;tTotal+=30;beeped=false;bar.classList.remove("done");paintTimer();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tTick)paintTimer();});

/* ---------- train ---------- */
function renderTrain(){
  views.train.innerHTML=
   '<div class="card"><h2>This week</h2>'+
   '<p class="lede" style="margin-top:4px">60 minutes of lifting a day, warm-up on top. Tap a day to log it.</p></div>'+
   PLAN.map(d=>{
     const last=lastFor(d.key),dr=drafts[draftKey(d.key)];
     const chip=dr?'<span class="chip warm">unsaved</span>'
       :last?'<span class="chip done">'+esc(daysAgo(last.date))+'</span>':'<span class="chip">not logged</span>';
     return '<button class="daybtn" data-day="'+d.key+'"><span class="idx">'+d.n+'</span>'+
       '<span class="body"><strong>'+esc(d.name)+'</strong><span>'+esc(d.day)+' · '+esc(d.focus)+'</span></span>'+chip+'</button>';
   }).join("")+
   '<div class="note-bar">Cardio is one 30–40 min steady session a week, on a rest day. Core runs twice a week, both on the leg days: ab wheel on Lower A, cable crunch on Lower B.</div>';
  views.train.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>openSession(b.dataset.day)));
}

function openSession(key){
  const d=PLAN.find(x=>x.key===key);current=d;
  const last=lastFor(key),lastSets=(last&&last.sets)||{};
  const dr=drafts[draftKey(key)],drSets=(dr&&dr.sets)||{};
  committed=false;
  views.session.innerHTML=
   '<div class="sessionhead"><div><h2 style="font-size:1.25rem">'+esc(d.name)+'</h2>'+
   '<p class="lede">'+esc(d.day)+' · '+esc(d.focus)+'</p></div>'+
   '<button class="back" id="back">Back</button></div>'+
   '<div class="note-bar">'+esc(d.blurb)+'</div>'+
   (last?'<div class="note-bar">Last logged '+esc(daysAgo(last.date))+' ('+esc(fmtDate(last.date))+'). Those numbers sit on the right of each row.</div>':'')+
   '<div class="card">'+d.ex.map(e=>{
     const prev=lastSets[e.id]||[];
     let rows='<div class="colhead"><span>Set</span><span>kg</span><span>Reps</span><span>Last</span></div><div class="sets">';
     for(let i=0;i<e.s;i++){
       const p=prev[i];
       const dv=(drSets[e.id]||[])[i]||{w:"",r:""};
       rows+='<div class="setrow"><span class="n">'+(i+1)+'</span>'+
         '<input id="'+e.id+'-w-'+i+'" value="'+esc(dv.w||"")+'" inputmode="decimal" placeholder="kg" aria-label="'+esc(e.n)+' set '+(i+1)+' weight">'+
         '<input id="'+e.id+'-r-'+i+'" value="'+esc(dv.r||"")+'" inputmode="numeric" placeholder="reps" aria-label="'+esc(e.n)+' set '+(i+1)+' reps">'+
         '<span class="last">'+(p?esc(p.w)+" × "+esc(p.r):"—")+'</span></div>';
     }
     return '<div class="ex"><h3><span class="tag">'+esc(e.tag)+'</span>'+esc(e.n)+'</h3>'+
       '<p class="target">'+e.s+' × '+esc(e.r)+' · rest '+esc(e.rest)+'</p>'+
       '<p class="note">'+esc(e.note)+'</p>'+rows+'</div>'+
       '<button class="restbtn" data-rs="'+e.rs+'" data-ex="'+esc(e.n)+'">Start '+esc(e.rest)+' rest</button></div>';
   }).join("")+'</div>'+
   '<div class="save"><p class="status" id="draftnote" style="margin:0 0 8px"></p>'+
   '<button class="btn" id="savebtn">Save session</button><p class="status" id="status"></p></div>';
  $("#back").addEventListener("click",()=>{clearTimeout(dTimer);writeDraft();show("train");renderTrain();});
  $("#savebtn").addEventListener("click",saveSession);
  views.session.querySelectorAll(".restbtn").forEach(b=>b.addEventListener("click",()=>
    startRest(parseInt(b.dataset.rs,10),b.dataset.ex)));
  views.session.querySelectorAll(".setrow input").forEach(i=>{
    i.addEventListener("input",queueDraft);i.addEventListener("change",queueDraft);
  });
  if(dr){const n=$("#draftnote");const c=collectSets(d).count;
    if(n)n.textContent="Picked up where you left off — "+c+" set"+(c===1?"":"s")+" entered, not yet in your history.";}
  show("session");window.scrollTo(0,0);
}

function saveSession(){
  if(!current)return;
  const st=$("#status"),got=collectSets(current);
  if(!got.count){st.textContent="Nothing entered yet — add a weight or rep count first.";return;}
  // strip the empty trailing sets a draft keeps as placeholders
  const sets={};
  Object.keys(got.sets).forEach(k=>{
    const kept=got.sets[k].filter(x=>x.w||x.r);
    if(kept.length)sets[k]=kept;
  });
  const date=today(),id=date+"__"+current.key;
  sessions=sessions.filter(s=>s.id!==id);
  sessions.push({id:id,date:date,dayKey:current.key,dayName:current.name,sets:sets,savedAt:new Date().toISOString()});
  sessions.sort((a,b)=>a.date<b.date?1:-1);
  if(save(KEY_S,sessions)){
    clearTimeout(dTimer);committed=true;dropDraft(current.key);
    const n=$("#draftnote");if(n)n.textContent="";
    st.textContent="Saved to your history — "+got.count+" sets logged.";
  }else{
    st.textContent="Couldn't write to storage. If you're in a private window, try a normal one.";
  }
}

/* ---------- history ---------- */
function renderHistory(){
  const body=sessions.length
   ? '<div class="card"><h2 style="margin-bottom:6px">Logged sessions</h2>'+
     sessions.slice(0,60).map(s=>{
       const first=Object.keys(s.sets||{})[0];
       const line=first&&s.sets[first].length?s.sets[first].map(x=>x.w+"×"+x.r).join(", "):"";
       return '<div class="histrow"><span><strong>'+esc(s.dayName||s.dayKey)+'</strong><br>'+
         '<span class="sub">'+esc(line)+'</span></span><span class="d">'+esc(fmtDate(s.date))+'</span></div>';
     }).join("")+'</div>'
   : '<div class="card"><div class="empty"><strong>No sessions logged yet</strong>Log a day from the Train tab and it appears here, newest first.</div></div>';
  views.history.innerHTML=body+
   '<div class="note-bar">Double progression: hit the top of the rep range on every set, then add 2.5 kg upstairs or 5 kg downstairs.</div>'+
   '<div class="card"><h2>Your data</h2>'+
   '<p class="lede" style="margin-top:4px">Stored on this device only. Export a backup now and then — and send me the file when you want the programme adjusted against your real numbers.</p>'+
   '<div class="btnrow"><button class="btn ghost" id="export">Export JSON</button>'+
   '<button class="btn ghost" id="importbtn">Import</button></div>'+
   '<input type="file" id="importfile" accept="application/json,.json" hidden>'+
   '<p class="status" id="datastatus"></p></div>';
  $("#export").addEventListener("click",exportData);
  $("#importbtn").addEventListener("click",()=>$("#importfile").click());
  $("#importfile").addEventListener("change",importData);
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"iron-icebox",exported:new Date().toISOString(),sessions:sessions,shopping:shopChecked},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="iron-icebox-"+today()+".json";document.body.appendChild(a);a.click();
  a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  $("#datastatus").textContent="Export started — check your downloads.";
}
function importData(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.sessions))throw new Error("shape");
      const byId={};sessions.concat(d.sessions).forEach(s=>{if(s&&s.id)byId[s.id]=s;});
      sessions=Object.values(byId).sort((a,b)=>a.date<b.date?1:-1);
      if(d.shopping&&typeof d.shopping==="object")shopChecked=d.shopping;
      save(KEY_S,sessions);save(KEY_SHOP,shopChecked);
      renderHistory();
      $("#datastatus").textContent="Imported — "+sessions.length+" sessions now stored.";
    }catch(err){$("#datastatus").textContent="That file isn't an Iron & Icebox export.";}
  };
  rd.readAsText(f);e.target.value="";
}

     c.dishes.map(d=>'<details class="dish"><summary><span>'+esc(d.name)+'</span><span class="chip warm">'+esc(d.portions)+'</span></summary>'+

       '<h4>Method</h4><ol>'+d.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>'+
       '<p class="reheat"><strong>Reheat:</strong> '+esc(d.reheat)+'</p></details>').join("")+'</div>').join("")+

   BREAKFAST.map(b=>'<div class="qa"><strong>'+esc(b.name)+'</strong>'+

   STORAGE.map(s=>'<li style="margin-bottom:6px">'+esc(s)+'</li>').join("")+'</ul></div>'+
   '<div class="card"><h2>Swaps</h2>'+SWAPS.map(s=>'<div class="qa"><strong>'+esc(s[0])+'</strong><span>'+esc(s[1])+'</span></div>').join("")+'</div>'+
   '<div class="card"><h2>When it goes wrong</h2>'+TROUBLE.map(s=>'<div class="qa"><strong>'+esc(s[0])+'</strong><span>'+esc(s[1])+'</span></div>').join("")+'</div>';

/* ---------- shop ---------- */
function renderShop(){
  const done=Object.keys(shopChecked).length;
  views.shop.innerHTML='<div class="card"><h2>Waitrose list</h2>'+
   '<p class="lede" style="margin-top:4px">One shop covers both cook days. '+(done?done+' ticked off.':'Nothing ticked yet.')+'</p>'+
   '<div id="shoplist" style="margin-top:10px"></div>'+
   '<div class="btnrow"><button class="btn ghost" id="clearshop">Clear ticks</button></div></div>'+
   '<div class="note-bar">Whey protein is not a Waitrose strong point — order it online and keep a tub at home.</div>';
  paintShop();
  $("#clearshop").addEventListener("click",()=>{shopChecked={};save(KEY_SHOP,shopChecked);renderShop();});
}
function paintShop(){
  const el=$("#shoplist");if(!el)return;
  el.innerHTML=SHOPPING.map(g=>'<p class="shopgroup">'+esc(g.group)+'</p>'+g.items.map(function(it){
    const nm=it[0],q=it[1],k=nm.replace(/[^a-z0-9]/gi,"").toLowerCase(),on=!!shopChecked[k];
    return '<label class="shopitem'+(on?" on":"")+'" data-k="'+k+'"><input type="checkbox"'+(on?" checked":"")+'>'+
      '<span class="nm">'+esc(nm)+'</span><span class="q">'+esc(q)+'</span></label>';
  }).join("")).join("");
  el.querySelectorAll(".shopitem input").forEach(inp=>inp.addEventListener("change",ev=>{
    const k=ev.target.closest(".shopitem").dataset.k;
    if(ev.target.checked)shopChecked[k]=true;else delete shopChecked[k];
    save(KEY_SHOP,shopChecked);paintShop();
  }));
}

/* ---------- boot ---------- */
function setNet(){
  $("#hdr-meta").innerHTML=navigator.onLine?"4-day upper/lower":'<span class="offline-dot"></span>offline — still logging';
}
window.addEventListener("online",setNet);window.addEventListener("offline",setNet);
pruneDrafts();
renderTrain();renderMeals();renderHistory();renderShop();setNet();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});
}
</script>
