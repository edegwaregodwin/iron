<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logged</title>
<meta name="description" content="A notebook for the 4-day upper/lower split and the two-cook meal plan. Works offline.">
<meta name="theme-color" content="#c8553d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logged">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A lab notebook: ruled paper, red margin rule, mono numerals, pencil headings.
   Layout: single column, sticky masthead + index tabs, sticky rest timer at the foot. */
:root{
  --paper:#f7f6f1; --card:#fffefa; --card-2:#f0eee6; --rule:#d9e3ec; --edge:#ddd9cd;
  --ink:#23272b; --ink-dim:#5f6670; --ink-faint:#8d939c;
  --margin-rule:#c8553d; --accent:#1f5f8b; --accent-soft:#e3edf6;
  --warm:#b4651f; --warm-soft:#f6e9d8; --on-accent:#ffffff;
  --font-hand:'Caveat',ui-rounded,'Segoe Print',cursive;
  --font-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --radius:4px; --rule-h:28px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181c; --card:#1b1f24; --card-2:#232830; --rule:#2d3540; --edge:#2a2f36;
  --ink:#e6e8ea; --ink-dim:#9aa3ad; --ink-faint:#6d757e;
  --margin-rule:#d4705c; --accent:#6aa8d8; --accent-soft:#1d2a35;
  --warm:#e0a062; --warm-soft:#32271b; --on-accent:#0d1419;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15181c; --card:#1b1f24; --card-2:#232830; --rule:#2d3540; --edge:#2a2f36;
  --ink:#e6e8ea; --ink-dim:#9aa3ad; --ink-faint:#6d757e;
  --margin-rule:#d4705c; --accent:#6aa8d8; --accent-soft:#1d2a35;
  --warm:#e0a062; --warm-soft:#32271b; --on-accent:#0d1419;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--card);border-bottom:1px solid var(--edge)}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:2px solid var(--margin-rule)}
header.top .wrap{padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--font-hand);font-size:2rem;font-weight:700;letter-spacing:.01em;line-height:1}
.brand .meta{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}
/* index tabs, like divider tabs on a notebook */
nav.tabs{display:flex;gap:3px;margin-top:9px}
nav.tabs button{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--edge);border-bottom:0;
  border-radius:var(--radius) var(--radius) 0 0;padding:8px 2px;font-family:var(--font-display);
  font-size:.76rem;font-weight:600;color:var(--ink-dim);cursor:pointer;transform:translateY(1px)}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--margin-rule);border-color:var(--margin-rule);border-bottom:2px solid var(--paper);transform:translateY(2px)}
main .wrap{padding-block:18px 96px}
section{display:flex;flex-direction:column;gap:14px}

/* a sheet of ruled paper, with the red margin rule down the left */
.card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);
  padding:14px 14px 14px 22px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule-h) - 1px),var(--rule) calc(var(--rule-h) - 1px),var(--rule) var(--rule-h));
  background-position:0 10px;box-shadow:0 1px 0 var(--edge)}
.card::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:var(--margin-rule);opacity:.55}
.card:has(.sets),.card:has(.shopitem),.card:has(.logsets),.card:has(.macro),
.card:has(.setrow),.card:has(.histrow){background-image:none}
.card h2{font-size:1rem;font-family:var(--font-display);letter-spacing:-.01em}
.card h2::after{content:"";display:block;width:34px;height:2px;background:var(--margin-rule);opacity:.5;margin-top:4px}
.lede{font-size:.88rem;color:var(--ink-dim)}
.note-bar{font-size:.78rem;color:var(--ink-dim);background:var(--card-2);border-left:3px solid var(--margin-rule);border-radius:0 var(--radius) var(--radius) 0;padding:9px 11px}

/* day list: entries on the page, numbered in the margin */
.daybtn{position:relative;width:100%;text-align:left;background:var(--card);border:1px solid var(--edge);
  border-radius:var(--radius);padding:13px 13px 13px 22px;cursor:pointer;display:flex;gap:10px;align-items:center;
  box-shadow:0 1px 0 var(--edge)}
.daybtn::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:var(--margin-rule);opacity:.55}
.daybtn:hover{border-color:var(--margin-rule)}
.daybtn .idx{font-family:var(--font-mono);font-size:1.25rem;font-weight:600;color:var(--margin-rule);min-width:1.6ch}
.daybtn .body{flex:1;min-width:0}
.daybtn .body strong{font-family:var(--font-display);font-size:1rem;display:block}
.daybtn .body span{font-size:.8rem;color:var(--ink-dim)}
.chip{display:inline-block;font-family:var(--font-mono);font-size:.64rem;font-weight:500;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--edge);border-radius:2px;background:var(--card-2);color:var(--ink-dim);white-space:nowrap}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.warm{background:var(--warm-soft);color:var(--warm);border-color:var(--warm)}

/* session sheet */
.sessionhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.sessionhead h2{font-family:var(--font-hand);font-size:1.9rem;font-weight:700;line-height:1}
.back{background:var(--card);border:1px solid var(--edge);border-radius:2px;padding:5px 12px;font-family:var(--font-mono);font-size:.74rem;cursor:pointer;color:var(--ink-dim)}
.ex{border-top:1px dashed var(--rule);padding-top:12px;margin-top:12px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex h3{font-size:.95rem;display:flex;gap:8px;align-items:baseline}
.ex h3 .tag{font-family:var(--font-mono);font-size:.7rem;font-weight:600;color:var(--margin-rule);letter-spacing:.04em}
.ex .target{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-dim);margin-top:2px}
.ex .note{font-size:.78rem;color:var(--ink-faint);margin-top:4px}
.sets{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.setrow,.colhead{display:grid;grid-template-columns:2rem 1fr 1fr 4.4rem;gap:6px;align-items:center}
.setrow .n{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-faint)}
.setrow input{width:100%;min-width:0;padding:8px;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;
  background:transparent;color:var(--ink);font-family:var(--font-mono);font-size:.92rem;text-align:center}
.setrow input::placeholder{color:var(--ink-faint);opacity:.6}
.setrow input:focus{outline:0;border-bottom-color:var(--margin-rule);background:var(--accent-soft)}
.setrow .last{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);text-align:right}
.colhead{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-top:9px}
.restbtn{margin-top:9px;background:var(--card-2);color:var(--accent);border:1px solid var(--accent);border-radius:2px;
  padding:6px 13px;font-family:var(--font-mono);font-size:.74rem;font-weight:500;cursor:pointer}

/* warm-up block */
.warm{background:var(--card-2);border:1px dashed var(--margin-rule);border-radius:var(--radius);padding:12px 13px}
.warm h3{font-family:var(--font-hand);font-size:1.4rem;font-weight:700;color:var(--margin-rule)}
.warm .gen{font-size:.84rem;color:var(--ink-dim);margin-top:4px}
.warm h4{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:11px 0 5px}
.warm ul{margin:0;padding-left:1.05rem;font-size:.84rem;color:var(--ink-dim)}
.warm ul li{margin-bottom:3px}
.ramp{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.ramprow{display:grid;grid-template-columns:4.6rem 1fr auto;gap:8px;align-items:baseline;
  font-family:var(--font-mono);font-size:.84rem;padding:4px 0;border-bottom:1px dotted var(--rule)}
.ramprow:last-child{border-bottom:0}
.ramprow b{font-weight:600;color:var(--ink)}
.ramprow span{font-family:var(--font-body);font-size:.78rem;color:var(--ink-faint)}
.ramprow em{font-style:normal;color:var(--accent);font-weight:500}
.ramptop{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);margin-top:7px}

.save{margin-top:8px}
.btn{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius);padding:13px;font-family:var(--font-display);font-weight:600;font-size:.95rem;cursor:pointer}
.btn.ghost{background:var(--card);border:1px solid var(--edge);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.status{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-dim);text-align:center;margin-top:6px;min-height:1.2em}

/* history */
.histrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule);
  font-size:.86rem;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit;color:inherit}
.histrow:last-child{border-bottom:0}
.histrow:hover .nm2{color:var(--margin-rule)}
.histrow .d{font-family:var(--font-mono);color:var(--ink-dim);white-space:nowrap}
.histrow .sub{font-family:var(--font-mono);color:var(--ink-faint);font-size:.74rem}
.histrow .chev{color:var(--ink-faint);font-size:1rem;flex:none;margin-left:4px}
.empty{text-align:center;color:var(--ink-dim);font-size:.86rem;padding:26px 10px}
.empty strong{display:block;font-family:var(--font-hand);color:var(--ink);font-size:1.5rem;margin-bottom:4px}
.logex{border-top:1px dashed var(--rule);padding-top:10px;margin-top:10px}
.logex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.logex h3{font-size:.9rem}
.logex .tagline{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);margin-top:1px}
.logsets{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.logset{background:var(--card-2);border:1px solid var(--edge);border-radius:2px;padding:4px 8px;font-family:var(--font-mono);font-size:.82rem}
.logset b{font-weight:600}
.logset i{font-style:normal;color:var(--ink-faint);font-size:.7rem;margin-right:4px}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.danger{background:var(--card);border:1px solid var(--edge);color:var(--ink-dim);border-radius:var(--radius);padding:11px;width:100%;font-family:var(--font-display);font-weight:600;font-size:.88rem;cursor:pointer}
.danger.armed{border-color:var(--margin-rule);color:var(--margin-rule)}

/* meals + shop */
details.dish,details.fold{border-top:1px dashed var(--rule);padding-top:10px;margin-top:10px}
details.dish:first-of-type,details.fold:first-of-type{border-top:0;margin-top:0;padding-top:0}
details summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details summary::-webkit-details-marker{display:none}
details .macros-line{font-family:var(--font-mono);font-size:.74rem;color:var(--accent);margin-top:6px}
details .selfline{font-size:.78rem;color:var(--ink-dim);margin-top:4px}
details h4{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:12px 0 4px}
details ul,details ol{margin:0;padding-left:1.1rem;font-size:.85rem;color:var(--ink-dim)}
details li{margin-bottom:4px}
.reheat{font-size:.78rem;color:var(--ink-dim);background:var(--card-2);border-left:3px solid var(--margin-rule);border-radius:0 2px 2px 0;padding:8px 10px;margin-top:10px}
.tl{display:flex;flex-direction:column}
.tlrow{display:grid;grid-template-columns:3.2rem 1fr;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:.84rem}
.tlrow:last-child{border-bottom:0}
.tlrow .t{font-family:var(--font-mono);font-weight:600;color:var(--margin-rule)}
.shopgroup{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:12px 0 4px}
.shopgroup:first-child{margin-top:0}
.shopitem{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.88rem;cursor:pointer;border-bottom:1px dotted var(--rule)}
.shopitem input{width:18px;height:18px;accent-color:var(--margin-rule);flex:none}
.shopitem .q{margin-left:auto;font-family:var(--font-mono);color:var(--ink-faint);font-size:.78rem;text-align:right}
.shopitem.on .nm{text-decoration:line-through;color:var(--ink-faint)}
.macros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:520px){.macros{grid-template-columns:repeat(4,minmax(0,1fr))}}
.macro{min-width:0;background:var(--card-2);border:1px solid var(--edge);border-radius:2px;padding:8px 10px}
.macro b{display:block;font-family:var(--font-mono);font-size:1.05rem;font-weight:600}
.macro span{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
.weekpick{display:flex;gap:3px}
.weekpick button{flex:1;background:var(--card-2);border:1px solid var(--edge);border-radius:2px;padding:8px 10px;font-family:var(--font-display);font-weight:600;font-size:.8rem;color:var(--ink-dim);cursor:pointer}
.weekpick button[aria-pressed="true"]{background:var(--card);color:var(--margin-rule);border-color:var(--margin-rule)}
.portionline{font-size:.76rem;color:var(--ink-faint);margin-top:8px}
.qa{border-top:1px dashed var(--rule);padding:10px 0}
.qa:first-of-type{border-top:0}
.qa strong{font-family:var(--font-display);font-size:.88rem;display:block}
.qa span{font-size:.83rem;color:var(--ink-dim)}
.offline-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warm);margin-right:5px;vertical-align:middle}

/* rest timer, clipped to the foot of the page like a bookmark */
#timerbar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-top:2px solid var(--margin-rule);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(0,0,0,.1)}
#timerbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
#timerbar .tnum{font-family:var(--font-mono);font-size:1.6rem;font-weight:600;min-width:4.3ch}
#timerbar .tlabel{flex:1;min-width:0;font-size:.76rem;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbar button{background:var(--card-2);border:1px solid var(--edge);border-radius:2px;padding:7px 11px;font-family:var(--font-mono);font-size:.74rem;cursor:pointer;flex:none}
#timerbar button.stop{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#tprog{height:3px;background:var(--accent);width:100%;transition:width .4s linear}
#timerbar.done .tnum{color:var(--margin-rule)}
#timerbar.done #tprog{background:var(--margin-rule)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Logged</h1><span class="meta" id="hdr-meta">4-day upper/lower</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-train" aria-selected="true">Train</button>
    <button role="tab" id="tab-history" aria-selected="false">History</button>
    <button role="tab" id="tab-meals" aria-selected="false">Meals</button>
    <button role="tab" id="tab-shop" aria-selected="false">Shop</button>
  </nav>
</div></header>

<main><div class="wrap">
  <section id="view-train"></section>
  <section id="view-session" hidden></section>
  <section id="view-history" hidden></section>
  <section id="view-meals" hidden></section>
  <section id="view-shop" hidden></section>
  <section id="view-log" hidden></section>
</div></main>

<div id="timerbar" hidden>
  <div id="tprog"></div>
  <div class="wrap">
    <span class="tnum" id="tnum">0:00</span>
    <span class="tlabel" id="tlabel"></span>
    <button id="tplus">+30s</button>
    <button id="tstop" class="stop">Stop</button>
  </div>
</div>

<script src="./app-data.js"></script>
<script>
/* ---------- storage: this device only ---------- */
const KEY_S="ii.sessions.v1",KEY_SHOP="ii.shopping.v1",KEY_DRAFT="ii.draft.v1";
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
let sessions=load(KEY_S,[]),shopChecked=load(KEY_SHOP,{}),drafts=load(KEY_DRAFT,{});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const views={train:$("#view-train"),session:$("#view-session"),history:$("#view-history"),meals:$("#view-meals"),shop:$("#view-shop"),log:$("#view-log")};
const tabs={train:$("#tab-train"),history:$("#tab-history"),meals:$("#tab-meals"),shop:$("#tab-shop")};
let current=null,wk=0;
function show(v){for(const k in views)views[k].hidden=true;views[v].hidden=false;
  for(const k in tabs)tabs[k].setAttribute("aria-selected",String(k===v||(v==="session"&&k==="train")||(v==="log"&&k==="history")));}
Object.keys(tabs).forEach(k=>tabs[k].addEventListener("click",()=>{
  if(current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}
  show(k);if(k==="train")renderTrain();if(k==="history")renderHistory();if(k==="shop")renderShop();
}));
window.addEventListener("pagehide",()=>{if(current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&current&&!views.session.hidden){clearTimeout(dTimer);writeDraft();}
});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
function fmtDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function daysAgo(iso){const d=Math.round((Date.now()-new Date(iso+"T12:00:00").getTime())/86400000);
  return d<=0?"today":d===1?"yesterday":d+" days ago";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function lastFor(key){return sessions.filter(s=>s.dayKey===key).sort((a,b)=>b.date<a.date?-1:1)[0];}
function mmss(sec){const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;return (sec<0?"-":"")+m+":"+String(s).padStart(2,"0");}

/* ---------- unsaved drafts ---------- */
function draftKey(dayKey){return today()+"__"+dayKey;}
function collectSets(d){
  const sets={};let count=0;
  d.ex.forEach(e=>{
    const arr=[];let any=false;
    for(let i=0;i<e.s;i++){
      const w=(($("#"+e.id+"-w-"+i))||{}).value||"",r=(($("#"+e.id+"-r-"+i))||{}).value||"";
      arr.push({w:w.trim(),r:r.trim()});
      if(w.trim()||r.trim()){any=true;count++;}
    }
    if(any)sets[e.id]=arr;
  });
  return {sets:sets,count:count};
}
let dTimer=null,committed=false;
function queueDraft(){committed=false;clearTimeout(dTimer);dTimer=setTimeout(writeDraft,400);}
function writeDraft(){
  if(!current||committed)return;
  const k=draftKey(current.key),got=collectSets(current);
  if(got.count)drafts[k]={sets:got.sets,at:new Date().toISOString()};else delete drafts[k];
  save(KEY_DRAFT,drafts);
  const n=$("#draftnote");
  if(n)n.textContent=got.count?"Kept as you type — "+got.count+" set"+(got.count===1?"":"s")+" entered, not yet in your history.":"";
}
function dropDraft(dayKey){delete drafts[draftKey(dayKey)];save(KEY_DRAFT,drafts);}
function pruneDrafts(){
  const cut=Date.now()-3*86400000;let changed=false;
  Object.keys(drafts).forEach(k=>{
    const at=drafts[k]&&drafts[k].at?new Date(drafts[k].at).getTime():0;
    if(at<cut){delete drafts[k];changed=true;}
  });
  if(changed)save(KEY_DRAFT,drafts);
}

/* ---------- rest timer ---------- */
const bar=$("#timerbar");
let tEnd=0,tTotal=0,tTick=null,audio=null,beeped=false;
function unlockAudio(){
  if(audio)return;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}
  if(audio&&audio.state==="suspended")audio.resume().catch(()=>{});
}
function beep(){
  if(!audio)return;
  const t0=audio.currentTime;
  [0,0.28,0.56].forEach(off=>{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type="sine";o.frequency.value=880;
    g.gain.setValueAtTime(0,t0+off);
    g.gain.linearRampToValueAtTime(0.3,t0+off+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.22);
    o.connect(g);g.connect(audio.destination);
    o.start(t0+off);o.stop(t0+off+0.24);
  });
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate([200,120,200]);}catch(e){}}
function startRest(sec,label){
  unlockAudio();
  tTotal=sec;tEnd=Date.now()+sec*1000;beeped=false;
  bar.classList.remove("done");bar.hidden=false;
  $("#tlabel").textContent=label||"Rest";
  if(tTick)clearInterval(tTick);
  tTick=setInterval(paintTimer,200);paintTimer();
}
function paintTimer(){
  const left=Math.round((tEnd-Date.now())/1000);
  $("#tnum").textContent=mmss(left);
  const frac=Math.max(0,Math.min(1,left/Math.max(1,tTotal)));
  $("#tprog").style.width=(frac*100)+"%";
  if(left<=0&&!beeped){beeped=true;bar.classList.add("done");beep();buzz();$("#tlabel").textContent="Rest over — next set";}
  if(left<=-120)stopRest();
}
function stopRest(){if(tTick)clearInterval(tTick);tTick=null;bar.hidden=true;bar.classList.remove("done");}
$("#tstop").addEventListener("click",stopRest);
$("#tplus").addEventListener("click",()=>{if(bar.hidden)return;unlockAudio();tEnd+=30000;tTotal+=30;beeped=false;bar.classList.remove("done");paintTimer();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tTick)paintTimer();});

/* ---------- warm-up ---------- */
function round2h(x){return Math.round(x/2.5)*2.5;}
function fmtKg(x){return (Math.round(x*10)/10).toString();}
function topWeightFor(dayKey,exId){
  const s=sessions.filter(x=>x.dayKey===dayKey).sort((a,b)=>b.date<a.date?-1:1)[0];
  if(!s||!s.sets||!s.sets[exId])return null;
  let top=null;
  s.sets[exId].forEach(x=>{const w=parseFloat(x.w);if(!isNaN(w)&&(top===null||w>top))top=w;});
  return top;
}
function warmupBlock(d){
  const first=d.ex[0],top=topWeightFor(d.key,first.id);
  let ramp;
  if(top===null||top<=0){
    ramp='<p class="warm ramptop" style="border:0;padding:0;margin-top:4px">'+esc(RAMP_NOHIST)+'</p>';
  }else{
    ramp='<div class="ramp">'+RAMP.map(r=>{
      const w=r.pct===0?null:round2h(top*r.pct);
      return '<div class="ramprow"><b>'+(w===null?"bar":fmtKg(w)+" kg")+'</b>'+
        '<span>'+esc(r.label)+'</span><em>\u00d7 '+esc(r.reps)+'</em></div>';
    }).join("")+'</div>'+
    '<p class="ramptop">Worked out from '+fmtKg(top)+' kg, your heaviest '+esc(first.n.toLowerCase())+' set last time. Then straight into '+first.s+' \u00d7 '+esc(first.r)+' at working weight.</p>';
  }
  return '<div class="warm"><h3>Warm-up</h3>'+
    '<p class="gen">'+esc(d.warmup.general)+'</p>'+
    '<h4>Then</h4><ul>'+d.warmup.drills.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'+
    '<h4>Ramp-ups on '+esc(first.n)+'</h4>'+ramp+
    '<p class="ramptop">'+esc(RAMP_NOTE)+'</p></div>';
}

/* ---------- train ---------- */
function renderTrain(){
  views.train.innerHTML=
   PLAN.map(d=>{
     const last=lastFor(d.key),dr=drafts[draftKey(d.key)];
     const chip=dr?'<span class="chip warm">unsaved</span>'
       :last?'<span class="chip done">'+esc(daysAgo(last.date))+'</span>':'<span class="chip">not logged</span>';
     return '<button class="daybtn" data-day="'+d.key+'"><span class="idx">'+d.n+'</span>'+
       '<span class="body"><strong>'+esc(d.name)+'</strong><span>'+esc(d.day)+' · '+esc(d.focus)+'</span></span>'+chip+'</button>';
   }).join("")+
   '';
  views.train.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>openSession(b.dataset.day)));
}

function openSession(key){
  const d=PLAN.find(x=>x.key===key);current=d;
  const last=lastFor(key),lastSets=(last&&last.sets)||{};
  const dr=drafts[draftKey(key)],drSets=(dr&&dr.sets)||{};
  committed=false;
  views.session.innerHTML=
   '<div class="sessionhead"><div><h2 style="font-size:1.25rem">'+esc(d.name)+'</h2>'+
   '<p class="lede">'+esc(d.day)+' · '+esc(d.focus)+'</p></div>'+
   '<button class="back" id="back">Back</button></div>'+
   (d.blurb?'<div class="note-bar">'+esc(d.blurb)+'</div>':'')+
   warmupBlock(d)+
   (last?'<div class="note-bar">Last logged '+esc(daysAgo(last.date))+', '+esc(fmtDate(last.date))+'.</div>':'')+
   '<div class="card">'+d.ex.map(e=>{
     const prev=lastSets[e.id]||[];
     let rows='<div class="colhead"><span>Set</span><span>kg</span><span>Reps</span><span>Last</span></div><div class="sets">';
     for(let i=0;i<e.s;i++){
       const p=prev[i];
       const dv=(drSets[e.id]||[])[i]||{w:"",r:""};
       rows+='<div class="setrow"><span class="n">'+(i+1)+'</span>'+
         '<input id="'+e.id+'-w-'+i+'" value="'+esc(dv.w||"")+'" inputmode="decimal" placeholder="kg" aria-label="'+esc(e.n)+' set '+(i+1)+' weight">'+
         '<input id="'+e.id+'-r-'+i+'" value="'+esc(dv.r||"")+'" inputmode="numeric" placeholder="reps" aria-label="'+esc(e.n)+' set '+(i+1)+' reps">'+
         '<span class="last">'+(p?esc(p.w)+" × "+esc(p.r):"—")+'</span></div>';
     }
     return '<div class="ex"><h3><span class="tag">'+esc(e.tag)+'</span>'+esc(e.n)+'</h3>'+
       '<p class="target">'+e.s+' × '+esc(e.r)+' · rest '+esc(e.rest)+'</p>'+
       '<p class="note">'+esc(e.note)+'</p>'+rows+'</div>'+
       '<button class="restbtn" data-rs="'+e.rs+'" data-ex="'+esc(e.n)+'">Start '+esc(e.rest)+' rest</button></div>';
   }).join("")+'</div>'+
   '<div class="save"><p class="status" id="draftnote" style="margin:0 0 8px"></p>'+
   '<button class="btn" id="savebtn">Save session</button><p class="status" id="status"></p></div>';
  $("#back").addEventListener("click",()=>{clearTimeout(dTimer);writeDraft();show("train");renderTrain();});
  $("#savebtn").addEventListener("click",saveSession);
  views.session.querySelectorAll(".restbtn").forEach(b=>b.addEventListener("click",()=>
    startRest(parseInt(b.dataset.rs,10),b.dataset.ex)));
  views.session.querySelectorAll(".setrow input").forEach(i=>{
    i.addEventListener("input",queueDraft);i.addEventListener("change",queueDraft);
  });
  if(dr){const n=$("#draftnote");const c=collectSets(d).count;
    if(n)n.textContent="Picked up where you left off — "+c+" set"+(c===1?"":"s")+" entered, not yet in your history.";}
  show("session");window.scrollTo(0,0);
}

function saveSession(){
  if(!current)return;
  const st=$("#status"),got=collectSets(current);
  if(!got.count){st.textContent="Nothing entered yet — add a weight or rep count first.";return;}
  // strip the empty trailing sets a draft keeps as placeholders
  const sets={};
  Object.keys(got.sets).forEach(k=>{
    const kept=got.sets[k].filter(x=>x.w||x.r);
    if(kept.length)sets[k]=kept;
  });
  const date=today(),id=date+"__"+current.key;
  sessions=sessions.filter(s=>s.id!==id);
  sessions.push({id:id,date:date,dayKey:current.key,dayName:current.name,sets:sets,savedAt:new Date().toISOString()});
  sessions.sort((a,b)=>a.date<b.date?1:-1);
  if(save(KEY_S,sessions)){
    clearTimeout(dTimer);committed=true;dropDraft(current.key);
    const n=$("#draftnote");if(n)n.textContent="";
    st.textContent="Saved to your history — "+got.count+" sets logged.";
  }else{
    st.textContent="Couldn't write to storage. If you're in a private window, try a normal one.";
  }
}

/* ---------- history ---------- */
function renderHistory(){
  const body=sessions.length
   ? '<div class="card"><h2 style="margin-bottom:6px">Logged sessions</h2>'+
     sessions.slice(0,60).map(s=>{
       const st=logStats(s);
       return '<button class="histrow" data-id="'+esc(s.id)+'">'+
         '<span style="flex:1;min-width:0"><strong class="nm2">'+esc(s.dayName||s.dayKey)+'</strong><br>'+
         '<span class="sub">'+st.exCount+' exercise'+(st.exCount===1?"":"s")+" \u00b7 "+st.setCount+' set'+(st.setCount===1?"":"s")+
         (st.tonnage?" \u00b7 "+st.tonnage.toLocaleString()+" kg total":"")+'</span></span>'+
         '<span class="d">'+esc(fmtDate(s.date))+'</span><span class="chev">\u203a</span></button>';
     }).join("")+'</div>'
   : '<div class="card"><div class="empty"><strong>No sessions logged yet</strong>Log a day from the Train tab and it appears here, newest first.</div></div>';
  views.history.innerHTML=body+
   '<div class="card"><h2>Your data</h2>'+
   '<p class="lede" style="margin-top:4px">Stored on this device only.</p>'+
   '<div class="btnrow"><button class="btn ghost" id="export">Export JSON</button>'+
   '<button class="btn ghost" id="importbtn">Import</button></div>'+
   '<input type="file" id="importfile" accept="application/json,.json" hidden>'+
   '<p class="status" id="datastatus"></p></div>';
  views.history.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openLog(b.dataset.id)));
  $("#export").addEventListener("click",exportData);
  $("#importbtn").addEventListener("click",()=>$("#importfile").click());
  $("#importfile").addEventListener("change",importData);
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"iron-icebox",exported:new Date().toISOString(),sessions:sessions,shopping:shopChecked},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="iron-icebox-"+today()+".json";document.body.appendChild(a);a.click();
  a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  $("#datastatus").textContent="Export started — check your downloads.";
}
function importData(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.sessions))throw new Error("shape");
      const byId={};sessions.concat(d.sessions).forEach(s=>{if(s&&s.id)byId[s.id]=s;});
      sessions=Object.values(byId).sort((a,b)=>a.date<b.date?1:-1);
      if(d.shopping&&typeof d.shopping==="object")shopChecked=d.shopping;
      save(KEY_S,sessions);save(KEY_SHOP,shopChecked);
      renderHistory();
      $("#datastatus").textContent="Imported — "+sessions.length+" sessions now stored.";
    }catch(err){$("#datastatus").textContent="That file isn't an Iron & Icebox export.";}
  };
  rd.readAsText(f);e.target.value="";
}

/* ---------- one logged session, in full ---------- */
function logStats(s){
  let setCount=0,exCount=0,tonnage=0;
  Object.keys(s.sets||{}).forEach(k=>{
    exCount++;
    s.sets[k].forEach(x=>{
      setCount++;
      const w=parseFloat(x.w),r=parseInt(x.r,10);
      if(!isNaN(w)&&!isNaN(r))tonnage+=w*r;
    });
  });
  return {setCount:setCount,exCount:exCount,tonnage:Math.round(tonnage)};
}
function openLog(id){
  const s=sessions.find(x=>x.id===id);
  if(!s){show("history");renderHistory();return;}
  const day=PLAN.find(d=>d.key===s.dayKey),st=logStats(s);
  const order=day?day.ex.map(e=>e.id):Object.keys(s.sets||{});
  const seen={};const rows=[];
  order.concat(Object.keys(s.sets||{})).forEach(k=>{
    if(seen[k]||!s.sets[k])return;seen[k]=true;
    const meta=day?day.ex.find(e=>e.id===k):null;
    rows.push('<div class="logex"><h3>'+esc(meta?meta.n:k)+'</h3>'+
      (meta?'<p class="tagline">'+esc(meta.tag)+' \u00b7 target '+meta.s+' \u00d7 '+esc(meta.r)+'</p>':'')+
      '<div class="logsets">'+s.sets[k].map((x,i)=>
        '<span class="logset"><i>'+(i+1)+'</i><b>'+esc(x.w||"\u2013")+'</b> kg \u00d7 '+esc(x.r||"\u2013")+'</span>').join("")+
      '</div></div>');
  });
  views.log.innerHTML=
   '<div class="sessionhead"><div><h2 style="font-size:1.25rem">'+esc(s.dayName||s.dayKey)+'</h2>'+
   '<p class="lede">'+esc(new Date(s.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))+'</p></div>'+
   '<button class="back" id="logback">Back</button></div>'+
   '<div class="card"><div class="sumrow">'+
   '<div class="macro"><b>'+st.exCount+'</b><span>exercises</span></div>'+
   '<div class="macro"><b>'+st.setCount+'</b><span>sets</span></div>'+
   (st.tonnage?'<div class="macro"><b>'+st.tonnage.toLocaleString()+'</b><span>kg lifted</span></div>':'')+
   '</div></div>'+
   '<div class="card">'+(rows.length?rows.join(""):'<div class="empty">Nothing recorded against this session.</div>')+'</div>'+
   '<div class="card"><button class="danger" id="del" data-armed="0">Delete this session</button>'+
   '<p class="status" id="delnote"></p></div>';
  $("#logback").addEventListener("click",()=>{show("history");renderHistory();});
  const del=$("#del");
  del.addEventListener("click",()=>{
    if(del.dataset.armed==="0"){
      del.dataset.armed="1";del.classList.add("armed");
      del.textContent="Tap again to delete";
      $("#delnote").textContent="This cannot be undone.";
      setTimeout(()=>{if(del.dataset.armed==="1"){del.dataset.armed="0";del.classList.remove("armed");
        del.textContent="Delete this session";$("#delnote").textContent="";}},4000);
      return;
    }
    sessions=sessions.filter(x=>x.id!==id);save(KEY_S,sessions);
    show("history");renderHistory();
  });
  show("log");window.scrollTo(0,0);
}

/* ---------- meals ---------- */

}
function wirePicker(root,rerender){

  }));
}

     c.dishes.map(d=>'<details class="dish"><summary><span>'+esc(d.name)+'</span><span class="chip warm">'+esc(d.portions)+'</span></summary>'+

     '<span>'+esc(b.what)+'</span></div>').join("")+'</div>'+
   '<div class="card"><h2>Storage and reheating</h2><ul style="margin:8px 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--ink-dim)">'+
   STORAGE.map(s=>'<li style="margin-bottom:6px">'+esc(s)+'</li>').join("")+'</ul></div>'+

   '<div class="card"><h2>When it goes wrong</h2>'+TROUBLE.map(s=>'<div class="qa"><strong>'+esc(s[0])+'</strong><span>'+esc(s[1])+'</span></div>').join("")+'</div>';

/* ---------- shop ---------- */
function shopList(){return SHOPPING[WEEKS[wk].id];}
function renderShop(){
  const done=shopList().reduce((n,g)=>n+g.items.filter(it=>shopChecked[key4(it[0])]).length,0);
  const total=shopList().reduce((n,g)=>n+g.items.length,0);
  views.shop.innerHTML=weekPicker()+
   '<div class="card"><h2>Waitrose list \u2014 '+esc(WEEKS[wk].label)+'</h2>'+
   '<p class="lede" style="margin-top:4px">'+done+' of '+total+' ticked off.</p>'+
   '<div id="shoplist" style="margin-top:10px"></div>'+
   '<div class="btnrow"><button class="btn ghost" id="clearshop">Clear ticks</button></div></div>'+
   '';
  paintShop();
  wirePicker(views.shop,renderShop);
  $("#clearshop").addEventListener("click",()=>{
    shopList().forEach(g=>g.items.forEach(it=>{delete shopChecked[key4(it[0])];}));
    save(KEY_SHOP,shopChecked);renderShop();
  });
}
function key4(nm){return WEEKS[wk].id+"_"+nm.replace(/[^a-z0-9]/gi,"").toLowerCase();}
function paintShop(){
  const el=$("#shoplist");if(!el)return;
  el.innerHTML=shopList().map(g=>'<p class="shopgroup">'+esc(g.group)+'</p>'+g.items.map(function(it){
    const nm=it[0],q=it[1],k=key4(nm),on=!!shopChecked[k];
    return '<label class="shopitem'+(on?" on":"")+'" data-k="'+k+'"><input type="checkbox"'+(on?" checked":"")+'>'+
      '<span class="nm">'+esc(nm)+'</span><span class="q">'+esc(q)+'</span></label>';
  }).join("")).join("");
  el.querySelectorAll(".shopitem input").forEach(inp=>inp.addEventListener("change",ev=>{
    const k=ev.target.closest(".shopitem").dataset.k;
    if(ev.target.checked)shopChecked[k]=true;else delete shopChecked[k];
    save(KEY_SHOP,shopChecked);renderShop();
  }));
}

  $("#hdr-meta").innerHTML=navigator.onLine?"4-day upper/lower":'<span class="offline-dot"></span>offline — still logging';
}
window.addEventListener("online",setNet);window.addEventListener("offline",setNet);
pruneDrafts();
renderTrain();renderMeals();renderHistory();renderShop();setNet();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});
}
